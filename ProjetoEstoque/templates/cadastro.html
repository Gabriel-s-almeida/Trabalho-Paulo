<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Doador - Proz-Unificar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #d90429; }
        .navbar-brand, .nav-link { color: white !important; font-weight: bold; }
        .nav-link.active { color: #ffccd5 !important; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-title { color: #d90429; font-weight: bold; }
        .step-title { color: #ef233c; font-weight: bold; border-bottom: 2px solid #ef233c; padding-bottom: 5px; margin-bottom: 15px; }
        .btn-proznificar { background-color: #d90429; color: white; font-weight: bold; border-radius: 30px; transition: background-color 0.3s; }
        .btn-proznificar:hover { background-color: #ef233c; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Proz-Unificar</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/cadastro">Formulário do Doador</a></li>
                    <li class="nav-item"><a class="nav-link" href="/visualizar">Ver Doadores</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="card p-4">
            <h2 class="card-title text-center mb-4">Formulário Cadastro de Doador</h2>
            
            {% if concluido %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    {{ concluido }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}
            
            <form method="post" action="/cadastrar_produto" class="row g-3">
                <div class="col-md-4 border-end pe-3">
                    <h5 class="step-title">Passo 1: Identificação</h5>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome Completo</label>
                        <input type="text" class="form-control" id="nome" name="nome_produto" placeholder="Nome do Doador" required>
                    </div>
                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpf" name="cpf_doador" placeholder="000.000.000-00" required>
                    </div>
                </div>

                <div class="col-md-4 border-end px-3">
                    <h5 class="step-title">Passo 2: Triagem Física</h5>
                    <div class="mb-3">
                        <label for="peso" class="form-label">Peso Corporal (kg)</label>
                        <input type="number" class="form-control" id="peso" name="quantidade" placeholder="Ex: 70" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label for="data_nascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control" id="data_nascimento" name="data_validadde" required>
                    </div>
                </div>

                <div class="col-md-4 ps-3">
                    <h5 class="step-title">Passo 3: Dados Biológicos</h5>
                    <div class="mb-3">
                        <label for="genero" class="form-label">Sexo Biológico</label>
                        <select id="genero" name="unidade" class="form-select" required>
                            <option value="" selected disabled>Selecione...</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Feminino">Feminino</option>
                        </select>
                    </div>
                </div>

                <div class="col-12 text-center mt-5">
                    <button type="submit" class="btn btn-proznificarc btn-lg px-5">Finalizar Cadastro e Salvar Vidas</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
